<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard — Rynix Tech</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="dashboard-card"><a class="auth-brand" href="index.html">RYNIX TECH</a><h1>You’re connected.</h1><p>Your Rynix Tech session is active.</p><p id="userEmail" class="user-email">Loading account…</p><button class="button button-primary" type="button" onclick="logout()">Log out</button></main><script type="module">import { auth } from './firebase.js'; import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js'; import './auth.js'; onAuthStateChanged(auth, user => { if (user) document.getElementById('userEmail').textContent = user.email || 'Signed in'; else window.location.replace('login.html'); });</script></body></html>
