<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Rynix Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="dashboard-card">
    <a class="auth-brand" href="index.html">RYNIX TECH</a>
    <h1>You’re connected.</h1>
    <p>Your Rynix Tech session is active and authenticated via Firebase.</p>
    
    <div id="profileDetails">
      <p id="userEmail" class="user-email">Loading account…</p>
      <p id="userRole" class="auth-links" style="margin-top:5px !important; margin-bottom: 20px !important;"></p>
    </div>

    <button class="button button-primary" type="button" onclick="logout()">Log out</button>
  </main>

  <script type="module" src="auth.js"></script>
  <script type="module">
    import { auth } from './firebase.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
    import { getUserProfile, ensureUserProfile } from './auth.js';

    const userEmailEl = document.getElementById('userEmail');
    const userRoleEl = document.getElementById('userRole');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          await user.reload();
        } catch (e) {}
        const currentUser = auth.currentUser;
        if (!currentUser || !currentUser.emailVerified) {
          window.location.replace('login.html');
          return;
        }
        const profile = await getUserProfile(currentUser.uid) || await ensureUserProfile(currentUser);
        userEmailEl.textContent = currentUser.email || 'Authenticated User';
        userRoleEl.textContent = `Role: ${profile?.role || 'user'} • UID: ${currentUser.uid.slice(0, 8)}…`;
      } else {
        window.location.replace('login.html');
      }
    });
  </script>
</body>
</html>
