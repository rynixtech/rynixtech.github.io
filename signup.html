<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Create a Rynix Tech account."><title>Create account — Rynix Tech</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-card"><a class="auth-brand" href="index.html">RYNIX TECH</a><h1>Join the mission.</h1><p>Create your account to access the Rynix Tech dashboard.</p>
  <label class="form-field">Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
  <label class="form-field">Password<input id="password" type="password" autocomplete="new-password" placeholder="Create a secure password" required></label>
  <button id="signupBtn" class="button button-primary" type="button" onclick="signupUser()">Create account <span aria-hidden="true">→</span></button>
  <div class="divider">or</div><button id="googleBtn" class="button button-google" type="button" onclick="googleLogin()">Continue with Google</button>
  <div class="message" id="message" role="status" aria-live="polite"></div><p class="auth-links">Already have an account? <a href="login.html">Log in</a></p>
</main>
<script type="module" src="auth.js"></script><script type="module">
import { auth, db } from './firebase.js';
import { setPersistence, browserLocalPersistence, createUserWithEmailAndPassword, sendEmailVerification, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
let isSubmitting = false;
onAuthStateChanged(auth, user => { if (user && !isSubmitting) window.location.replace(user.emailVerified ? 'index.html' : 'verify.html'); });
window.signupUser = async () => { const email = document.getElementById('email').value.trim(), password = document.getElementById('password').value, btn = document.getElementById('signupBtn'), message = document.getElementById('message'); if (!email || !password) { message.style.color = 'var(--danger)'; message.textContent = 'Enter both your email address and password.'; return; } isSubmitting = true; btn.disabled = true; btn.textContent = 'Creating account…'; try { await setPersistence(auth, browserLocalPersistence); const { user } = await createUserWithEmailAndPassword(auth, email, password); await setDoc(doc(db, 'users', user.uid), { email: user.email, role: 'user', createdAt: serverTimestamp() }, { merge: true }); await sendEmailVerification(user); window.location.replace('verify.html'); } catch (error) { isSubmitting = false; message.style.color = 'var(--danger)'; message.textContent = error.message; btn.disabled = false; btn.textContent = 'Create account →'; } };
</script></body></html>
