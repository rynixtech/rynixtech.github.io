<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050711">
  <meta name="description" content="Create a Rynix Tech account.">
  <title>Create account — Rynix Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="auth-brand" href="index.html">RYNIX TECH</a>
    <h1>Join the mission.</h1>
    <p id="intro">Create your account, then verify your email with a secure link.</p>
    
    <form id="signupForm">
      <label class="form-field">Email
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>
      
      <label class="form-field">Password
        <div class="password-field-wrapper">
          <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">👁</button>
        </div>
      </label>

      <label class="form-field">Confirm Password
        <div class="password-field-wrapper">
          <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter password" required>
          <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">👁</button>
        </div>
      </label>

      <button id="signupBtn" class="button button-primary" type="submit">
        Create account <span aria-hidden="true">→</span>
      </button>
      
      <div class="divider">or</div>
      <button id="googleBtn" class="button button-google" type="button">Continue with Google</button>
    </form>

    <div class="message" id="message" role="status" aria-live="polite"></div>
    <p class="auth-links">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script type="module">
    import { auth } from './firebase.js';
    import { createUserWithEmailAndPassword, sendEmailVerification, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
    import { ensureUserProfile, googleLogin, redirectBasedOnRole } from './auth.js';

    const signupForm = document.getElementById('signupForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const signupBtn = document.getElementById('signupBtn');
    const googleBtn = document.getElementById('googleBtn');
    const message = document.getElementById('message');

    googleBtn.addEventListener('click', googleLogin);

    // If already logged in & verified, redirect
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          await user.reload();
        } catch (err) {}
        const currentUser = auth.currentUser;
        if (currentUser && currentUser.emailVerified) {
          await redirectBasedOnRole(currentUser);
        }
      }
    });

    function showError(msg) {
      message.style.color = 'var(--danger)';
      message.textContent = msg;
    }

    function showSuccess(msg) {
      message.style.color = 'var(--success)';
      message.textContent = msg;
    }

    async function handleSignup() {
      const emailValue = email.value.trim();
      const passValue = password.value;
      const confirmValue = confirmPassword.value;

      message.textContent = '';

      if (!emailValue || !passValue || !confirmValue) {
        return showError('Please fill in all fields.');
      }

      if (passValue !== confirmValue) {
        return showError('Passwords do not match.');
      }

      if (passValue.length < 8) {
        return showError('Password must be at least 8 characters.');
      }

      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account…';

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, emailValue, passValue);
        const user = userCredential.user;

        // Save profile to Firestore users/{uid}
        await ensureUserProfile(user);

        // Send standard Firebase email verification link
        await sendEmailVerification(user);

        showSuccess('Verification email sent! Redirecting to verification page…');
        signupBtn.textContent = 'Verification Email Sent ✓';

        setTimeout(() => {
          window.location.href = 'verify.html';
        }, 1500);

      } catch (error) {
        let msg = error.message;
        if (error.code === 'auth/email-already-in-use') {
          msg = 'An account with this email already exists. Please log in.';
        } else if (error.code === 'auth/invalid-email') {
          msg = 'Please enter a valid email address.';
        } else if (error.code === 'auth/weak-password') {
          msg = 'Password is too weak. Please use at least 8 characters.';
        }
        showError(msg);
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create account →';
      }
    }

    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleSignup();
    });
  </script>
</body>
</html>
