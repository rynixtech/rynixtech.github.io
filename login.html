<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050711">
  <meta name="description" content="Sign in to your Rynix Tech account.">
  <title>Log in — Rynix Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="auth-brand" href="index.html">RYNIX TECH</a>
    <h1>Welcome back.</h1>
    <p>Sign in to return to the Rynix Tech home page.</p>

    <form id="loginForm">
      <label class="form-field">Email
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>

      <label class="form-field">Password
        <div class="password-field-wrapper">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">👁</button>
        </div>
      </label>

      <button id="loginBtn" class="button button-primary" type="submit">
        Log in <span aria-hidden="true">→</span>
      </button>

      <div class="divider">or</div>
      <button id="googleBtn" class="button button-google" type="button">Continue with Google</button>
    </form>

    <div class="message" id="message" role="status" aria-live="polite"></div>
    <div id="resendContainer" style="display: none; margin-top: 14px;">
      <button id="resendBtn" class="button button-quiet" type="button" style="width: 100%; font-size: 0.82rem;">
        Resend verification email ✉
      </button>
    </div>
    <p class="auth-links">
      <a href="forgot.html">Forgot password?</a><br><br>
      New to Rynix? <a href="signup.html">Create an account</a>
    </p>
  </main>

  <script type="module">
    import { auth } from './firebase.js';
    import { setPersistence, browserLocalPersistence, signInWithEmailAndPassword, sendEmailVerification, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
    import { ensureUserProfile, googleLogin, redirectBasedOnRole } from './auth.js';

    const loginForm = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const googleBtn = document.getElementById('googleBtn');
    const message = document.getElementById('message');
    const resendContainer = document.getElementById('resendContainer');
    const resendBtn = document.getElementById('resendBtn');

    googleBtn.addEventListener('click', googleLogin);

    let unverifiedUser = null;

    // Auto-redirect if already logged in and verified
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          await user.reload();
        } catch (err) {
          console.warn('User reload error:', err);
        }
        const currentUser = auth.currentUser;
        if (currentUser && currentUser.emailVerified) {
          await ensureUserProfile(currentUser);
          await redirectBasedOnRole(currentUser);
        } else if (currentUser && !currentUser.emailVerified) {
          unverifiedUser = currentUser;
          message.style.color = 'var(--danger)';
          message.textContent = 'Please verify your email before logging in.';
          resendContainer.style.display = 'block';
        }
      }
    });

    resendBtn.addEventListener('click', async () => {
      const targetUser = auth.currentUser || unverifiedUser;
      if (!targetUser) {
        message.style.color = 'var(--danger)';
        message.textContent = 'Please sign in first to resend verification email.';
        return;
      }
      resendBtn.disabled = true;
      resendBtn.textContent = 'Sending link…';
      try {
        await sendEmailVerification(targetUser);
        message.style.color = 'var(--success)';
        message.textContent = 'Verification email sent! Check your inbox or spam folder.';
      } catch (err) {
        message.style.color = 'var(--danger)';
        message.textContent = err.message || 'Failed to send verification email.';
      } finally {
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend verification email ✉';
      }
    });

    async function handleLogin() {
      const emailValue = email.value.trim();
      const passValue = password.value;

      message.textContent = '';
      resendContainer.style.display = 'none';

      if (!emailValue || !passValue) {
        message.style.color = 'var(--danger)';
        message.textContent = 'Enter both your email address and password.';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';

      try {
        await setPersistence(auth, browserLocalPersistence);
        const userCredential = await signInWithEmailAndPassword(auth, emailValue, passValue);
        let user = userCredential.user;

        try {
          await user.reload();
        } catch (e) {
          console.warn(e);
        }
        user = auth.currentUser || user;

        if (!user.emailVerified) {
          unverifiedUser = user;
          message.style.color = 'var(--danger)';
          message.textContent = 'Please verify your email before logging in.';
          resendContainer.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log in →';
          return;
        }

        await ensureUserProfile(user);
        await redirectBasedOnRole(user);
      } catch (error) {
        message.style.color = 'var(--danger)';
        let msg = error.message;
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          msg = 'Invalid email or password. Please try again.';
        } else if (error.code === 'auth/invalid-email') {
          msg = 'Please enter a valid email address.';
        }
        message.textContent = msg;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log in →';
      }
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleLogin();
    });
  </script>
</body>
</html>
