<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify email — Rynix Tech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card auth-card--small">
    <a class="auth-brand" href="index.html">RYNIX TECH</a>
    <h1>Verify your email.</h1>
    <p id="verifyIntro">We sent a verification link to your inbox. Open the link in your email, then return here to continue.</p>

    <button id="checkBtn" class="button button-primary" type="button">
      Check verification status <span aria-hidden="true">→</span>
    </button>
    <button id="resendBtn" class="button button-google" type="button" style="margin-top:10px;">Resend verification link</button>

    <div id="status" class="message" role="status" aria-live="polite"></div>
    <p class="auth-links"><a href="login.html">Back to log in</a></p>
  </main>

  <script type="module" src="auth.js"></script>
  <script type="module">
    import { auth } from './firebase.js';
    import { sendEmailVerification, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
    import { ensureUserProfile } from './auth.js';

    const status = document.getElementById('status');
    const verifyIntro = document.getElementById('verifyIntro');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace('login.html');
      } else {
        try {
          await user.reload();
        } catch(e){}
        const currentUser = auth.currentUser;
        if (currentUser && currentUser.emailVerified) {
          await ensureUserProfile(currentUser);
          window.location.replace('index.html');
        } else if (currentUser && currentUser.email) {
          verifyIntro.textContent = `We sent a verification link to ${currentUser.email}. Open the link in your email, then click below to verify status.`;
        }
      }
    });

    document.getElementById('resendBtn').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) {
        status.style.color = 'var(--danger)';
        status.textContent = 'Session expired. Please log in again.';
        return;
      }
      try {
        await sendEmailVerification(user);
        status.style.color = 'var(--success)';
        status.textContent = 'Verification link resent! Check your inbox or spam folder.';
      } catch (error) {
        status.style.color = 'var(--danger)';
        status.textContent = error.message;
      }
    });

    document.getElementById('checkBtn').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) {
        window.location.replace('login.html');
        return;
      }
      try {
        await user.reload();
        const freshUser = auth.currentUser;
        if (freshUser && freshUser.emailVerified) {
          await ensureUserProfile(freshUser);
          status.style.color = 'var(--success)';
          status.textContent = 'Email verified successfully! Redirecting…';
          setTimeout(() => {
            window.location.replace('index.html');
          }, 1000);
        } else {
          status.style.color = 'var(--gold)';
          status.textContent = 'Not verified yet. Please open the link in your email, then click here again.';
        }
      } catch (error) {
        status.style.color = 'var(--danger)';
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
