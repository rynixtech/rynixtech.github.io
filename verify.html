<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verify email — Rynix Tech</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-card auth-card--small"><a class="auth-brand" href="index.html">RYNIX TECH</a><h1>Verify your email.</h1><p>We sent a verification link to your inbox. Open it, then return here to continue.</p><button id="checkBtn" class="button button-primary" type="button">I’ve verified my email <span aria-hidden="true">→</span></button><button id="resendBtn" class="button button-google" type="button">Resend verification</button><div id="status" class="message" role="status" aria-live="polite"></div><p class="auth-links"><a href="login.html">Back to log in</a></p></main>
<script type="module">import { auth } from './firebase.js'; import { sendEmailVerification, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js'; const status = document.getElementById('status'); onAuthStateChanged(auth, user => { if (!user) window.location.replace('login.html'); }); document.getElementById('resendBtn').addEventListener('click', async () => { const user = auth.currentUser; if (!user) return; try { await sendEmailVerification(user); status.style.color = 'var(--success)'; status.textContent = 'Verification email resent. Check your inbox or spam folder.'; } catch (error) { status.style.color = 'var(--danger)'; status.textContent = error.message; } }); document.getElementById('checkBtn').addEventListener('click', async () => { const user = auth.currentUser; if (!user) return; try { await user.reload(); if (user.emailVerified) window.location.replace('index.html'); else { status.style.color = 'var(--gold)'; status.textContent = 'Not verified yet. Open the email link, then try again.'; } } catch (error) { status.style.color = 'var(--danger)'; status.textContent = error.message; } });</script></body></html>
