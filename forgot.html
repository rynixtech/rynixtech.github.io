<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset password — Rynix Tech</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><main class="auth-card auth-card--small"><a class="auth-brand" href="index.html">RYNIX TECH</a><h1>Reset password.</h1><p>Enter the email address linked to your account. We’ll send a secure reset link.</p><label class="form-field">Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><button id="sendBtn" class="button button-primary" type="button">Send reset email <span aria-hidden="true">→</span></button><div class="message" id="message" role="status" aria-live="polite"></div><p class="auth-links"><a href="login.html">Back to log in</a></p></main>
<script type="module">import { auth } from './firebase.js'; import { sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js'; const email = document.getElementById('email'), button = document.getElementById('sendBtn'), message = document.getElementById('message'); button.addEventListener('click', async () => { if (!email.value.trim()) { message.style.color = 'var(--danger)'; message.textContent = 'Enter your email address.'; return; } button.disabled = true; button.textContent = 'Sending…'; try { await sendPasswordResetEmail(auth, email.value.trim()); message.style.color = 'var(--success)'; message.textContent = 'Reset email sent. Check your inbox and spam folder.'; } catch (error) { message.style.color = 'var(--danger)'; message.textContent = error.message; button.disabled = false; button.textContent = 'Send reset email →'; } });</script></body></html>
