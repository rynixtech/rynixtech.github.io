<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Rynix Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card auth-card--small">
    <a class="auth-brand" href="index.html">RYNIX TECH</a>
    <h1>Reset password.</h1>
    <p id="intro">Enter your email address to receive a password reset link.</p>

    <form id="resetForm">
      <label class="form-field">Email
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </label>
      <button id="sendBtn" class="button button-primary" type="submit">
        Send reset link <span aria-hidden="true">→</span>
      </button>
    </form>

    <div class="message" id="message" role="status" aria-live="polite"></div>
    <p class="auth-links"><a href="login.html">Back to log in</a></p>
  </main>

  <script type="module" src="auth.js"></script>
  <script type="module">
    import { auth } from './firebase.js';
    import { sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';

    const resetForm = document.getElementById('resetForm');
    const emailInput = document.getElementById('email');
    const sendBtn = document.getElementById('sendBtn');
    const message = document.getElementById('message');

    async function handleReset() {
      const email = emailInput.value.trim();
      message.textContent = '';

      if (!email) {
        message.style.color = 'var(--danger)';
        message.textContent = 'Please enter your email address.';
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending reset link…';

      try {
        await sendPasswordResetEmail(auth, email);
        message.style.color = 'var(--success)';
        message.textContent = 'Password reset email sent! Check your inbox or spam folder.';
      } catch (error) {
        message.style.color = 'var(--danger)';
        let msg = error.message;
        if (error.code === 'auth/user-not-found') {
          msg = 'No account found with this email.';
        } else if (error.code === 'auth/invalid-email') {
          msg = 'Please enter a valid email address.';
        }
        message.textContent = msg;
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send reset link →';
      }
    }

    resetForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleReset();
    });
  </script>
</body>
</html>
